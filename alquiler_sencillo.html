<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alquiler sencillo</title>
    <link rel="stylesheet" href="alquiler_sencillo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="alquiler_sencillo.js" defer></script>
</head>
<body>
    <!-------------------------------------->
    <!--|estructuracion_alquiler_sencillo|-->
    <!-------------------------------------->
    <main class="app">
        <!-- ENCABEZADO: título y descripción -->
        <header class="encabezado">
            <h1>Alquiler Sencillo</h1>
            <p>Elige un objeto y mira su precio al instante.</p>
        </header>
        <!-- PANEL 1: formulario de alquiler -->
        <section class="panel">
            <h2>Nuevo alquiler</h2>
            <!-- novalidate: la validación la hacemos nosotros con JavaScript -->
            <form id="formulario" novalidate>
                <!-- Campo: nombre de quien alquila -->
                <div class="campo">
                    <label for="cliente">Nombre de quien alquila</label>
                    <input type="text" id="cliente" placeholder="Ej: Carlos Pérez"
                        maxlength="40" autocomplete="off">
                </div>
                <!-- Fila con dos campos lado a lado -->
                <div class="fila">
                    <!-- Lista desplegable: JavaScript agrega los objetos disponibles -->
                    <div class="campo">
                        <label for="objeto">Objeto</label>
                        <select id="objeto">
                            <option value="">Selecciona un objeto</option>
                        </select>
                    </div>
                    <!-- Campo: cantidad de días -->
                    <div class="campo">
                        <label for="dias">Días</label>
                        <input type="number" id="dias" value="1" min="1" max="30" step="1">
                    </div>
                </div>
                <!-- Vista previa del precio (JavaScript la actualiza al instante) -->
                <div class="precio-caja">
                    <div class="precio-dato">
                        <span>Precio por día</span>
                        <strong id="precioDia">—</strong>
                    </div>
                    <div class="precio-dato">
                        <span>Total a pagar</span>
                        <strong id="precioTotal" class="precio-total">—</strong>
                    </div>
                </div>
                <!-- Aquí JavaScript escribe los mensajes de error -->
                <p id="mensaje" class="mensaje" role="alert"></p>
                <!-- Botón que envía el formulario -->
                <button type="submit" class="boton">Registrar alquiler</button>
            </form>
        </section>
        <!-- PANEL 2: alquileres registrados -->
        <section class="panel">
            <h2>Alquileres registrados</h2>
            <!-- Texto que se muestra cuando aún no hay alquileres -->
            <p id="vacio" class="vacio">Aún no hay alquileres registrados.</p>
            <!-- Lista donde JavaScript inserta cada alquiler -->
            <ul id="lista" class="lista"></ul>
            <!-- Suma de todos los alquileres -->
            <div class="suma">
                <span>Total general</span>
                <strong id="totalGeneral">$ 0</strong>
            </div>
        </section>
    </main>
</body>
</html>
